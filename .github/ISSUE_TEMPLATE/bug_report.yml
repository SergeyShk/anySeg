name: Bug report
description: Wrong segmentation, exception or crash
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happens
      description: The tokens or sentences you expected and the ones you got
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal code with the text that triggers the bug and the full traceback, if any
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: anySeg version
      description: "`python -c \"import anyseg; print(anyseg.__version__)\"`"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and OS
      placeholder: "Python 3.12, macOS 15"
    validations:
      required: true
